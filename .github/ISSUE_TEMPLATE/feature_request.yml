name: Đề xuất tính năng
description: Package thiếu thứ gì đó bạn cần
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Bạn đang vướng gì
      description: |
        Mô tả vấn đề bạn đang gặp, không chỉ giải pháp bạn nghĩ tới.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Hiện đang làm sao để đi tiếp
      description: |
        `RawMessage` hoặc `->request()` có dùng tạm được không?

  - type: dropdown
    id: scope
    attributes:
      label: Thuộc phần nào
      options:
        - Official Account API
        - Bot API
        - Webhook
        - UI
        - Command
        - Testing (Zalo::fake)
        - Khác
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: Bạn hình dung code trông thế nào
      render: php
