name: Báo cáo hành vi API của Zalo
description: Bạn đã gọi thật một API và kết quả khác với package
labels: [api-behaviour]
body:
  - type: markdown
    attributes:
      value: |
        Tài liệu của Zalo không phải lúc nào cũng đầy đủ. Nếu bạn gọi thật một
        API và thấy payload hoặc hành vi khác với package, báo cáo ở đây giúp
        sửa cho đúng.

  - type: input
    id: endpoint
    attributes:
      label: Endpoint hoặc method
      placeholder: "ImageMessage::url() / POST /v3.0/oa/message/cs"
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Request đã gửi
      description: URL, method và body. Xoá token, secret và dữ liệu cá nhân.
      render: json
    validations:
      required: true

  - type: textarea
    id: response
    attributes:
      label: Response Zalo trả về
      description: Nguyên văn, kèm mã lỗi.
      render: json
    validations:
      required: true

  - type: input
    id: context
    attributes:
      label: Bối cảnh OA hoặc Bot
      description: Ảnh hưởng tới kết quả — OA đã xác thực chưa, gói dịch vụ nào, trong hay ngoài khung 48 giờ.
      placeholder: "OA đã xác thực, trong khung 48 giờ"
