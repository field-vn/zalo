name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ghim laravel/framework + orchestra/testbench THEO CẶP.
        #
        # Ghim từng gói illuminate/* thì không giải được: package require cả
        # illuminate/console, /database và /support, nên ghim mỗi /support để
        # composer tự do chọn /console phiên bản khác — mâu thuẫn ngay. Tệ hơn,
        # testbench kéo theo laravel/framework, mà gói này REPLACE illuminate/*
        # nên không thể cùng tồn tại với một illuminate/support require tường minh.
        #
        # Dùng `include` thay vì tổ hợp + `exclude` để không sinh ra cặp
        # PHP/Laravel không tồn tại.
        include:
          - { php: '8.2', laravel: '10.*', testbench: '8.*' }
          - { php: '8.3', laravel: '10.*', testbench: '8.*' }
          - { php: '8.2', laravel: '11.*', testbench: '9.*' }
          - { php: '8.3', laravel: '11.*', testbench: '9.*' }
          - { php: '8.4', laravel: '11.*', testbench: '9.*' }
          - { php: '8.2', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '13.*', testbench: '11.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*' }

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl, mbstring, pdo_sqlite, sqlite3
          ini-values: memory_limit=-1
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

  quality:
    runs-on: ubuntu-latest
    name: Static analysis & style
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, openssl, mbstring, pdo_sqlite, sqlite3
          ini-values: memory_limit=-1
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer analyse
      - run: composer format -- --test
