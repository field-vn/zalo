version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Chỉ quan tâm dev dependency: các ràng buộc runtime cố ý để rộng
    # (illuminate/* ^10|^11|^12|^13) nên không cần dependabot đụng vào.
    allow:
      - dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
